[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -c /app/data/config/nginx.conf -g "daemon off;"
user=cloudron
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:netbird-server]
command=/app/code/bin/netbird-server
    --config /app/data/config/config.yaml
directory=/app/data
user=cloudron
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NETBIRD_STORE_ENGINE_POSTGRES_DSN="%(ENV_NETBIRD_STORE_ENGINE_POSTGRES_DSN)s"

[program:netbird-proxy]
command=/app/code/start-proxy.sh
directory=/app/data
user=cloudron
autostart=true
autorestart=unexpected
exitcodes=0,78
startsecs=0
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
