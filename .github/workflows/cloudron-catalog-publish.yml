---
name: Cloudron Catalog Publication
concurrency:
  group: cloudron-catalog-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  catalog:
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    uses: marcusquinn/aidevops/.github/workflows/cloudron-catalog-publish-reusable.yml@e774543b16b778c3e95a431d0a2b6d91a89e8803
    with:
      aidevops_ref: e774543b16b778c3e95a431d0a2b6d91a89e8803
      package_checks: |
        bash ./test/package-test.sh
        bash ./test/publish-catalog-test.sh
      image_repository: ghcr.io/marcusquinn/cloudron-netbird-app
      cli_version: 8.2.6
      cli_integrity: sha512-LHd+4u6pJxDtHX1JuVuWqrUuTbkDu+iH4jjNWW6JgB4+iDLusp08rpt6gifTFPbQjbCZHhnD8LbAGzM1NzDCXw==
    secrets:
      CLOUDRON_RELEASE_PAT: "${{ secrets.CLOUDRON_RELEASE_PAT }}"
'on':
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
