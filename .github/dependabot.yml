version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "github-actions"
    # aidevops pins move with aidevops_ref via `aidevops sync-workflows`.
    ignore:
      - dependency-name: "marcusquinn/aidevops*"
